# 旧实验覆盖文件：不再自动加载。默认算法参数在 agents/x2_supermimic_cfg.py。
# 命令行只需写与本配方不同的值。

# 实验与环境
run_name = "getup_scratch_wm8_actor32_obsnorm_target_v2"
num_envs = 16
iterations = 200
seed = 43
device = "cuda:0"
viz = "none"

# 全部网络随机初始化；不读取旧离线转移数据。
world_model_scratch = true
offline_world_fraction = 0.0

# 采样与回放
collection_steps = 32
replay_steps = 2048
world_batch_size = 128
policy_batch_size = 128
amp_batch_size = 128
action_noise = 0.1

# 世界模型和策略
world_hidden_dims = [512, 512, 512]
world_horizons = [8]
imagination_horizon = 32
world_updates = 10
discriminator_updates = 4
world_lr = 0.0002
actor_lr = 0.0002
critic_lr = 0.0002

# 监督预热：期间只更新世界模型。
warmup_steps = 512
warmup_updates = 500
warmup_collect_interval = 50

# 真实评估、检查点与日志
# eval_seconds 为仿真时间；评估沿用现有几何站稳定义。
eval_interval = 50
eval_seconds = 20.0
eval_seed = 4242
checkpoint_interval = 50
log_interval = 10
